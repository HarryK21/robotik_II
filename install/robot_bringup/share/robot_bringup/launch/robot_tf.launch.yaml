launch:

- node:
    pkg: "tf2_ros"
    exec: "static_transform_publisher"
    name: "parent_to_child_tf"
    args: '0.0 0.0 0.25 3.14159 0.0 0.0 my_parent_frame my_child_frame'

- node:
    pkg: "tf2_ros"
    exec: "static_transform_publisher"
    name: "base_footprint_to_base_link_tf"
    args: '0.0 0.0 0.01 0.0 0.0 0.0 base_footprint base_link'

- node:
    pkg: "tf2_ros"
    exec: "static_transform_publisher"
    name: "base_link_to_imu_link"
    args: '0.0 0.0 0.068 0.0 0.0 0.0 base_link imu_link'

- node:
    pkg: "tf2_ros"
    exec: "static_transform_publisher"
    name: "base_link_to_laser_frame"
    args: '0.0 0.0 0.15 0.0 0.0 3.14159 base_link laser_frame'

- node:
    pkg: "tf2_ros"
    exec: "static_transform_publisher"
    name: "base_link_to_camera_link"
    args: '0.07 0.0 0.11 0.0 0.0 0.0 base_link camera_link'